# ===========================================================================
#  Wound healing in skin - the setup behind Cao et al.
#
#  Run it:      ../../bin/dycelfem run.cfg
#  Or the whole pipeline (simulate + analyse + plot + video):
#               ../../scripts/dycelfem_run.sh run.cfg
#
#  ~300 steps takes roughly half an hour on a modern laptop and writes about
#  4 GB of frames and cell dumps. Lower run.steps, or raise output.image_every,
#  for a quicker look.
# ===========================================================================

# Initial tissue: epidermis, dermis with fibroblasts, hypodermis, and a
# 200-unit-radius wound filled with fibrin clot carrying PDGF.
input = tissue-with-wound.txt

[sbml]
common       = mcommon.xml
macrophage   = mmacrophage.xml
fibroblast   = mfibroblast.xml
keratinocyte = mkeratinocyte.xml
ecm          = mecm.xml
bm           = mbm.xml
clot         = mclot.xml

[run]
# 1 step = DeltaT = 60 min, so 300 steps is about 12.5 days.
steps          = 300
autostart      = 1
exit_when_done = 1
mode           = 1
diffusion      = edgelen
seed           = 0

[output]
dir            = out
data_every     = 1
image_every    = 1
species_images = 1
sections       = full

[view]
width      = 1000
height     = 700
autofit    = 1
margin     = 0.03

# Zoom about the fitted centre. 1 = the whole tissue is guaranteed visible, but
# aspect padding leaves empty space above and below a wide flat tissue.
# 1.5 fills the frame for this example. Raise it to close in on the wound, and
# use center_x/center_y (world coordinates; the wound is at 0,0) to reframe.
zoom       = 1.5

# Centre of the view in world coordinates. The tissue spans Y from about -553
# (bottom of the hypodermis) to +651 (top of the epidermis); centring at 150
# rather than the geometric centre puts the wound and the epidermis in frame
# and drops the inert hypodermis off the bottom.
center_x   = 0
center_y   = 180

show_index = 0
